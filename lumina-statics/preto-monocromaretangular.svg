<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Sombra suave escura para dar leve destaque ao ícone contra o fundo claro -->
    <filter id="darkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- SEM RECT DE FUNDO = TRANSPARENTE -->

  <!-- ICONE EM TONS DE PRETO -->
  <g transform="translate(80, 85)" filter="url(#darkShadow)">
    <!-- Linhas de circuito em preto com baixa opacidade -->
    <path d="M 60,-20 L 60,60 L 140,100" fill="none" stroke="#0f172a" stroke-width="3" stroke-opacity="0.1" stroke-dasharray="6 4"/>
    <path d="M 140,140 L 60,180 L -20,180" fill="none" stroke="#0f172a" stroke-width="3" stroke-opacity="0.1" stroke-dasharray="6 4"/>

    <!-- O "L" em Prisma (Preto Sólido / Grafite Escuro) -->
    <path d="M 30,20 L 90,50 L 90,130 L 30,190 L 30,110 Z" fill="#0f172a" />
    
    <!-- Face de reflexo tridimensional (Preto com opacidade para criar a diferenciação de profundidade) -->
    <path d="M 90,50 L 150,20 L 150,100 L 90,130 Z" fill="#0f172a" fill-opacity="0.4" />
    
    <!-- Ponto Luminoso de Conexão -->
    <circle cx="150" cy="20" r="10" fill="#0f172a" />
    <circle cx="150" cy="20" r="22" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.15"/>
    
    <!-- Detalhe interno geométrico contrastante -->
    <path d="M 50,60 L 75,72 L 75,120 L 50,145 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- TIPOGRAFIA DA MARCA UTILIZANDO A TAG <text> -->
  <!-- Nome principal em Preto Sólido -->
  <text x="340" y="210" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#0f172a">LUMINA</text>
        
  <!-- Subtítulo "System" em Grafite Médio -->
  <text x="345" y="265" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" 
        font-weight="400" 
        letter-spacing="12" 
        fill="#475569">SYSTEM</text>
        
</svg>
