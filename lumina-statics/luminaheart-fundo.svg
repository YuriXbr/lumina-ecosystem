<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Cyberpunk Roxo-Rosa Oficial Lumina -->
    <linearGradient id="luminaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    
    <!-- Gradiente de Brilho Translúcido -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtro Neon Soft para Estética de Software Moderno -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo Escuro Deep Tech Fixo -->
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16"/>

  <!-- ICONE CENTRALIZADO -->
  <g transform="translate(140, 140)" filter="url(#neonGlow)">
    <!-- Linhas de Conexão em Roxo Sutil -->
    <path d="M 110,-10 L 110,40 M 110,180 L 110,240" fill="none" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <path d="M -20,70 L 40,70 M 180,70 L 240,70" fill="none" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="6 4"/>

    <!-- Face Esquerda Superior do Coração -->
    <path d="M 110,65 L 45,20 C 15,0 0,35 15,65 L 110,175 Z" fill="url(#luminaGrad)" />
    
    <!-- Face Direita Superior (Reflexo de Luz / Prisma Ativo) -->
    <path d="M 110,65 L 175,20 C 205,0 220,35 205,65 L 110,175 Z" fill="url(#glowGrad)" />
    
    <!-- Divisor Geométrico Central para efeito 3D Amigável -->
    <path d="M 110,65 L 75,40 L 45,20 L 70,65 L 110,175 L 150,65 L 175,20 L 145,40 Z" fill="#ffffff" opacity="0.12"/>
    
    <!-- Ponto Luminoso de Conexão (Nó Superior Esquerdo) -->
    <circle cx="45" cy="20" r="9" fill="#F472B6" />
    <circle cx="45" cy="20" r="18" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.4"/>

    <!-- Ponto Luminoso de Conexão (Nó Superior Direito) -->
    <circle cx="175" cy="20" r="9" fill="#EC4899" />
  </g>
</svg>
