<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Cyberpunk Roxo-Rosa -->
    <linearGradient id="luminaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    
    <!-- Gradiente de Brilho Translúcido -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Sombra suave para destacar as camadas sobre o fundo transparente -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- SEM RECT DE FUNDO = TRANSPARENTE -->

  <!-- GRUPO DO ÍCONE (Centralizado na parte superior para o formato quadrado) -->
  <g transform="translate(170, 70)" filter="url(#neonShadow)">
    <!-- Linhas de código / conexões de rede em roxo sutil -->
    <path d="M 60,-20 L 60,60 L 140,100" fill="none" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <path d="M 140,140 L 60,180 L -20,180" fill="none" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="6 4"/>

    <!-- Prisma Central (O "L" Estilizado) -->
    <path d="M 30,20 L 90,50 L 90,130 L 30,190 L 30,110 Z" fill="url(#luminaGrad)" />
    
    <!-- Face de reflexo tridimensional -->
    <path d="M 90,50 L 150,20 L 150,100 L 90,130 Z" fill="url(#glowGrad)" />
    
    <!-- Nó de rede / Pulso luminoso -->
    <circle cx="150" cy="20" r="10" fill="#F472B6" />
    <circle cx="150" cy="20" r="22" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.4"/>
    
    <!-- Recorte interno tecnológico (Máscara vazada) -->
    <!-- Nota: Usa opacidade total mas simula corte interno no prisma -->
    <path d="M 50,60 L 75,72 L 75,120 L 50,145 Z" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- GRUPO DE TEXTO (Alinhamento centralizado perfeito para avatar e perfil) -->
  <g text-anchor="middle">
    <!-- Nome principal -->
    <text x="250" y="350" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#luminaGrad)">LUMINA</text>
          
    <!-- Subtítulo "System" -->
    <text x="254" y="395" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="24" 
          font-weight="400" 
          letter-spacing="14" 
          fill="#A78BFA">SYSTEM</text>
          
  </g>
</svg>
