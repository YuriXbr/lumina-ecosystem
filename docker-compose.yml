# Local development only. No fallback to the production database or bot token.
# Copy .env.example to .env and fill the LUMINA_DEV_* variables privately.
# docker compose up --build -> http://localhost:8080
# The real Discord bot is opt-in: docker compose --profile bot up --build
services:
  lumina-api:
    build: ./lumina-api
    restart: unless-stopped
    networks: [lumina-network]
    environment:
      NODE_ENV: development
      PORT: 3000
      TRUST_PROXY: uniquelocal
      MONGODB_URI: ${LUMINA_DEV_MONGODB_URI:?Set a dedicated development MongoDB replica-set URI}
      JWT_SECRET: ${LUMINA_DEV_JWT_SECRET:?Set a development JWT secret}
      INTERNAL_API_KEY: ${LUMINA_DEV_INTERNAL_API_KEY:?Set a development internal key}
      LUMINA_API_KEY: ${LUMINA_DEV_API_KEY:?Set a development API key}
      OAUTH_STATE_SECRET: ${LUMINA_DEV_OAUTH_STATE_SECRET:?Set a development OAuth secret}
      ENCRYPTION_KEY: ${LUMINA_DEV_ENCRYPTION_KEY:?Set a development encryption key}
      DISCORD_CLIENT_ID: ${LUMINA_DEV_DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${LUMINA_DEV_DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${LUMINA_DEV_DISCORD_BOT_TOKEN:-}
      DISCORD_AUTH_REDIRECT_URI: http://localhost:8080/expapi/oauth2/discord/auth/callback
      DASHBOARD_PROTOCOL: http
      DASHBOARD_DOMAIN: localhost:8080
      ACCOUNT_PUBLIC_ORIGIN: http://localhost:8080
      WEBHOOK_URL: ''
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 3
  lumina-dashboard:
    build:
      context: ./lumina-dashboard
      args:
        VITE_API_BASE_URL: ''
        VITE_DISCORD_CLIENT_ID: ${LUMINA_DEV_DISCORD_CLIENT_ID:-}
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    depends_on:
      lumina-api:
        condition: service_healthy
    networks: [lumina-network]
  lumina-bot:
    profiles: [bot]
    build: ./lumina-bot
    restart: unless-stopped
    depends_on:
      lumina-api:
        condition: service_healthy
    networks: [lumina-network]
    environment:
      NODE_ENV: development
      DISCORD_BOT_TOKEN: ${LUMINA_DEV_DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${LUMINA_DEV_DISCORD_CLIENT_ID:-}
      API_BASE_URL: http://lumina-api:3000
      INTERNAL_API_KEY: ${LUMINA_DEV_INTERNAL_API_KEY:?Set a development internal key}
      LUMINA_API_KEY: ${LUMINA_DEV_API_KEY:?Set a development API key}
      ENCRYPTION_KEY: ${LUMINA_DEV_ENCRYPTION_KEY:?Set a development encryption key}
networks:
  lumina-network:
    driver: bridge
