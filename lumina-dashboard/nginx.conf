# ──────────────────────────────────────────────────────────────────────────────
# Configuração do Nginx para o Lumina Dashboard
#
# O Nginx serve os arquivos estáticos do build do Vite (HTML/CSS/JS).
# Também faz proxy reverso das rotas /expapi e /api para o container da API,
# permitindo que o dashboard e a API funcionem sob o mesmo domínio (same-origin).
#
# Isso resolve os problemas de CORS e SameSite cookies em produção:
#   - Sem proxy: dashboard em bot.dominio.com, API em api.dominio.com
#     → cross-origin: exige CORS; subdomínios HTTPS podem continuar same-site
#   - Com proxy: ambos em bot.dominio.com
#     → same-origin → SameSite=Lax funciona, sem CORS
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy reverso para a API ────────────────────────────────────────────
    # Todas as requisições /expapi/* e /api/* são encaminhadas para o
    # container `lumina-api` na porta 3000. O header Host é preservado
    # para que a API saiba qual domínio o cliente usou.
    location /expapi/ {
        proxy_pass http://lumina-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Permite que o cookie httpOnly seja repassado corretamente
        proxy_pass_request_headers on;
    }

    location /api/ {
        proxy_pass http://lumina-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # React Router usa rotas client-side (ex: /members, /settings, /u/user).
    # O Nginx precisa devolver index.html para qualquer rota que não seja
    # um arquivo estático, senão o browser recebe 404 ao recarregar a página.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache de assets estáticos ───────────────────────────────────────────
    # Arquivos com hash no nome (ex: index-a1b2c3.js) podem ser cacheados
    # agressivamente pois o hash muda quando o conteúdo muda.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
