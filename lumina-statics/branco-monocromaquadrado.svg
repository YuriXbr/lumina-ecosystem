<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sombra suave monocromática para dar profundidade ao ícone -->
    <filter id="monoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- SEM RECT DE FUNDO = TRANSPARENTE -->

  <!-- ICONE MONOCROMÁTICO BRANCO (Centralizado no topo) -->
  <g transform="translate(170, 65)" filter="url(#monoShadow)">
    <!-- Linhas de circuito em branco com baixa opacidade -->
    <path d="M 60,-20 L 60,60 L 140,100" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.1" stroke-dasharray="6 4"/>
    <path d="M 140,140 L 60,180 L -20,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.1" stroke-dasharray="6 4"/>

    <!-- O "L" em Prisma (Branco Sólido) -->
    <path d="M 30,20 L 90,50 L 90,130 L 30,190 L 30,110 Z" fill="#ffffff" />
    
    <!-- Face de reflexo tridimensional (Branco Translúcido) -->
    <path d="M 90,50 L 150,20 L 150,100 L 90,130 Z" fill="#ffffff" fill-opacity="0.3" />
    
    <!-- Ponto Luminoso de Conexão -->
    <circle cx="150" cy="20" r="10" fill="#ffffff" />
    <circle cx="150" cy="20" r="22" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
    
    <!-- Detalhe interno geométrico vazado -->
    <path d="M 50,60 L 75,72 L 75,120 L 50,145 Z" fill="#000000" opacity="0.2"/>
  </g>

  <!-- TIPOGRAFIA CENTRALIZADA BRANCA -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Nome principal -->
    <text x="250" y="350" font-size="54" font-weight="900" letter-spacing="4" fill="#ffffff">LUMINA</text>
          
    <!-- Subtítulo "SYSTEM" -->
    <text x="254" y="395" font-size="24" font-weight="400" letter-spacing="14" fill="#e2e8f0">SYSTEM</text>
          
    <!-- Tagline Fábrica de Software -->
    <text x="252" y="430" font-size="11" font-weight="600" letter-spacing="5" fill="#94a3b8">SOFTWARE FACTORY</text>
  </g>
</svg>
